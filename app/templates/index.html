<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d73">
  <title>Office Task &amp; Performance Management</title>
  <link rel="stylesheet" href="/static/css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="brand-lockup"><img class="emblem" src="/static/images/emblem.png" alt="Official institutional emblem">
      <div><span class="eyebrow">OFFICE OPERATIONS</span><strong>Task &amp; Performance</strong></div></div>
    <div id="identity" class="identity" hidden></div>
  </header>
  <main id="main" class="app-shell">
    <section id="login-panel" class="login-panel" aria-labelledby="login-title">
      <div class="login-brand"><img src="/static/images/emblem.png" alt="Official institutional emblem"></div>
      <p class="eyebrow">SECURE OFFICE SIGN-IN</p>
      <h1 id="login-title">Welcome back</h1>
      <p class="muted">Sign in with the account provided by your system administrator.</p>
      <form id="login-form" class="stack-form">
        <label>Username<input name="username" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button primary" type="submit">Sign in</button>
      </form>
      <p id="login-error" class="message error" role="alert" hidden></p>
    </section>

    <section id="workspace" hidden>
      <nav class="navigation" aria-label="Main navigation">
        <button data-view="dashboard" class="nav-button active">Overview</button>
        <button data-view="tasks" class="nav-button">Tasks</button>
        <button data-view="timetable" class="nav-button">Weekly timetable</button>
        <button data-view="reports" class="nav-button">Shift reports</button>
        <button data-view="analytics" class="nav-button">Performance</button>
        <button data-view="equipment" class="nav-button">Equipment &amp; custody</button>
        <button data-view="social" class="nav-button social-only" hidden>TBC Digital social media</button>
        <button data-view="accounts" class="nav-button admin-only" hidden>Accounts &amp; setup</button>
        <button data-view="audit" class="nav-button audit-only" hidden>Audit history</button>
        <button id="password-button" class="nav-button">Change password</button>
        <button id="logout-button" class="button quiet">Sign out</button>
      </nav>
      <div id="flash" class="message" role="status" hidden></div>
      <section id="view-dashboard" class="view"></section>
      <section id="view-tasks" class="view" hidden></section>
      <section id="view-timetable" class="view" hidden></section>
      <section id="view-reports" class="view" hidden></section>
      <section id="view-analytics" class="view" hidden></section>
      <section id="view-equipment" class="view" hidden></section>
      <section id="view-social" class="view" hidden></section>
      <section id="view-accounts" class="view" hidden></section>
      <section id="view-audit" class="view" hidden></section>
    </section>
  </main>
  <footer class="site-footer"><span>Private office system · Use only on the authorized network</span><img src="/static/images/tbc-digital-logo.jpg" alt="TBC Digital"></footer>
  <script src="/static/js/social-charts.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</body>
</html>
